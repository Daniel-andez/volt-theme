# ANARIAS Product Optimizer — Shopify App Configuration
# Corre "npm run config:link" para conectar este archivo con tu app del Partner Dashboard

name = "ANARIAS Product Optimizer"
client_id = ""

[access_scopes]
scopes = "read_products,write_products"

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"
